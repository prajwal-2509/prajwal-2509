<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #0f1420; stroke: #1f2733; stroke-width: 1; }
      .node { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .node-text { fill: #f0f6fc; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; }
      .sub-text { fill: #8b949e; font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; }
      .path { fill: none; stroke: #30363d; stroke-width: 2; }
      .dot { fill: #58a6ff; }
      .label { fill: #8b5cf6; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 2px; }
    </style>
  </defs>

  <rect class="bg" width="900" height="220"/>
  <rect class="card" x="10" y="10" width="880" height="200" rx="10"/>

  <text class="label" x="34" y="42">THE LOOP</text>

  <!-- path connecting the 4 nodes in a loop -->
  <path id="loopPath" class="path"
        d="M 140,140 L 340,140 L 340,140 L 540,140 L 740,140 L 740,140 Q 800,140 800,110 Q 800,60 740,60 L 140,60 Q 80,60 80,90 Q 80,120 140,140 Z"/>

  <!-- straight connectors between the 4 stage nodes -->
  <line class="path" x1="220" y1="100" x2="320" y2="100"/>
  <line class="path" x1="420" y1="100" x2="520" y2="100"/>
  <line class="path" x1="620" y1="100" x2="720" y2="100"/>

  <!-- return arc from Ship back to Learn -->
  <path class="path" d="M 780,100 Q 830,100 830,150 Q 830,190 450,190 Q 100,190 100,150 Q 100,120 140,100" />

  <!-- moving dot traveling the full loop -->
  <circle class="dot" r="5">
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M 140,100 L 320,100 L 320,100 L 520,100 L 720,100 L 780,100 Q 830,100 830,150 Q 830,190 450,190 Q 100,190 100,150 Q 100,120 140,100 Z" />
  </circle>

  <!-- node: Learn -->
  <rect class="node" x="60" y="80" width="160" height="40" rx="8"/>
  <text class="node-text" x="140" y="97" text-anchor="middle">Learn</text>
  <text class="sub-text" x="140" y="112" text-anchor="middle">go to first principles</text>

  <!-- node: Break -->
  <rect class="node" x="320" y="80" width="160" height="40" rx="8"/>
  <text class="node-text" x="400" y="97" text-anchor="middle">Break</text>
  <text class="sub-text" x="400" y="112" text-anchor="middle">push it until it fails</text>

  <!-- node: Build -->
  <rect class="node" x="520" y="80" width="160" height="40" rx="8"/>
  <text class="node-text" x="600" y="97" text-anchor="middle">Build</text>
  <text class="sub-text" x="600" y="112" text-anchor="middle">fix it properly</text>

  <!-- node: Ship -->
  <rect class="node" x="720" y="80" width="140" height="40" rx="8"/>
  <text class="node-text" x="790" y="97" text-anchor="middle">Ship</text>
  <text class="sub-text" x="790" y="112" text-anchor="middle">it actually works</text>
</svg>
